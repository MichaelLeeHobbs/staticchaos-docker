# Automated dependency freshness (#85). Weekly PRs grouped to keep the noise low.
# Covers the two pnpm workspaces (root tooling + web app), the GitHub Actions in
# ci.yml, and the Docker base images (kept digest-pinned; dependabot bumps the digest).
version: 2
updates:
  - package-ecosystem: "npm"          # pnpm workspaces resolve under the npm ecosystem
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      root-deps:
        patterns: ["*"]
        # Keep MAJOR bumps OUT of the group -- a breaking major (e.g. MUI 6->9,
        # xterm 5->6) shouldn't fail the whole grouped PR. Majors come as their
        # own PRs, reviewed/migrated one at a time.
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-deps:
        patterns: ["*"]
        # Keep MAJOR bumps OUT of the group -- a breaking major (e.g. MUI 6->9,
        # xterm 5->6) shouldn't fail the whole grouped PR. Majors come as their
        # own PRs, reviewed/migrated one at a time.
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        # Keep MAJOR bumps OUT of the group -- a breaking major (e.g. MUI 6->9,
        # xterm 5->6) shouldn't fail the whole grouped PR. Majors come as their
        # own PRs, reviewed/migrated one at a time.
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"       # Dockerfile base images (digest-pinned, #63)
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"

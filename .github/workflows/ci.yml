name: CI

# Gates every PR (and every push to main), then publishes the MUD image on main.
#
# The authoritative C gate is `docker compose build mud`: the server only
# compiles 32-bit on Debian bullseye/gcc 10, which the Dockerfile pins. Node
# tooling and the web app are checked in the same job so a single run tells you
# whether the whole pipeline (area data -> world-maps -> web) is healthy.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-check:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      # Authoritative C gate first: this is the real "does it still build" check.
      - name: Compile the MUD (Docker build, 32-bit bullseye/gcc 10)
        run: docker compose build mud

      # Behavioural gate: boot the freshly-built image and drive a real telnet
      # session (create char -> command -> save -> log back in). Exercises the
      # nanny/login + save/load paths (comm.c/save.c/db.c) that unit checks miss (#69).
      - name: Integration smoke test
        run: bash test/run-smoke.sh

      # Node tooling deps (repo root) power both the C lint and the data build.
      - name: Install tooling deps
        run: pnpm install --frozen-lockfile

      # Parser drift guard (#57): golden test for tools/lib/area.mjs vs src/db.c.
      - name: Test area parser (drift guard)
        run: pnpm test

      - name: Lint C (fails on bare magic indices)
        run: pnpm run lint:c

      # Static analysis for the C server. High-value checks (buffer overflow, array
      # OOB, null deref, format/scanf) fail the build; known-intentional idioms and
      # 32-bit int<->pointer casts are muted in .cppcheck-suppressions (see #62).
      # Pinned to bullseye's cppcheck (2.3) via a container so the gate is
      # reproducible -- ubuntu-latest's cppcheck version drifts and finds a moving
      # set of issues. Run the same command locally to reproduce CI exactly.
      - name: Static analysis (cppcheck, pinned)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo debian:bullseye-slim sh -c \
            "apt-get update -qq && apt-get install -y -qq cppcheck && \
             cppcheck --enable=warning,portability --inline-suppr --std=c99 -q -I src \
               --suppressions-list=.cppcheck-suppressions --error-exitcode=1 src"

      # Parse area/*.are -> world-maps/. Skips build:pdf* (needs a puppeteer
      # Chrome we don't provision in CI).
      - name: Build world data
        run: pnpm run build:data

      # Validate the generators' output contracts (shape/non-empty/required
      # fields/uniqueness) -- catches a parser/format change silently producing
      # malformed or empty world-maps (#70). Runs after build:data.
      - name: Test generator output contracts
        run: pnpm run test:generators

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Web typecheck
        working-directory: web
        run: pnpm run typecheck

      - name: Web build
        working-directory: web
        run: pnpm run build

      # Fail on HIGH-severity vulnerabilities in the public-facing site's deps so
      # they can't drift back in (#68/#85). Moderate/low are surfaced but don't block;
      # dependabot (.github/dependabot.yml) opens the fix PRs.
      - name: Web dependency audit (fail on high)
        working-directory: web
        run: pnpm audit --prod --audit-level high

  publish-image:
    name: Publish MUD image (GHCR)
    # Only publish from main, and only after the gate above passes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image paths must be lowercase, but ${{ github.repository }} can
      # contain uppercase (e.g. MichaelLeeHobbs/...). Lowercase it first.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/mud" >> "$GITHUB_OUTPUT"

      # The image carries only the initial/seed game state baked from the repo.
      # Runtime player data (player/notes/finger/log and the auto-dumped area)
      # lives in named volumes at run time and is never part of the image.
      - name: Build and push MUD image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}

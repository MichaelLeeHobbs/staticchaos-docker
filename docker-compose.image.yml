# Image-based production deploy (#64).
#
# Runs the CI-published GHCR image instead of building the server on the host.
# Deploy becomes "pull a tag + up" (see mud-deploy-image.example.sh); rollback is
# "point MUD_IMAGE at the previous tag + up".
#
# SAVE-STATE vs SEED-STATE (the important part):
#   * The image carries only INITIAL/seed state (the area seed and the empty a-z
#     player skeleton baked by the Dockerfile). It contains NO live player data.
#   * Runtime state -- player/ notes/ finger/ log/ and the auto-dumped area -- lives
#     in the named volumes below and is NEVER part of the image. Swapping image tags
#     (upgrade or rollback) leaves those volumes untouched.
#   * `name: staticchaos` pins the compose project so the volumes resolve to the
#     SAME staticchaos_area / staticchaos_player / ... that the build-based
#     docker-compose.yml already uses on the host. Cutting over from build to image
#     therefore keeps every existing character. (Verify once with `docker volume ls`.)
#
# Usage (prod):
#   MUD_IMAGE=ghcr.io/michaelleehobbs/staticchaos-docker/mud:sha-<sha> \
#     docker compose -f docker-compose.image.yml pull
#   ... up -d
name: staticchaos

services:
  mud:
    image: ${MUD_IMAGE:-ghcr.io/michaelleehobbs/staticchaos-docker/mud:latest}
    pull_policy: always
    container_name: staticchaos
    ports:
      - "${MUD_PORT:-4000}:4000"
    volumes:
      - area:/mud/area
      - player:/mud/player
      - notes:/mud/notes
      - finger:/mud/finger
      - log:/mud/log
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Bound the captured stderr log (#84): ~50MB rotated, so it can't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Browser "Play Now" client bridge (github.com/maldorne/mud-web-proxy).
  # Prod posture: bound to LOCALHOST only -- a host TLS reverse proxy
  # (Caddy/Traefik/nginx) terminates wss and forwards to 127.0.0.1:6200.
  # See docs/WEB-CLIENT.md. Set MUD_PROXY_ALLOWED_ORIGINS to the site origin.
  mud-web-proxy:
    image: ghcr.io/maldorne/mud-web-proxy:latest
    pull_policy: always
    container_name: mud-web-proxy
    depends_on:
      - mud
    ports:
      - "127.0.0.1:${MUD_WS_PORT:-6200}:6200"
    environment:
      WS_PORT: "6200"
      TLS_ENABLED: "false"        # TLS terminated by the upstream reverse proxy
      NODE_ENV: "production"
      COMPRESS: "false"
      CHAT_ENABLED: "false"
      ENABLE_LEGACY_ROUTING: "false"
      ALLOWED_ORIGINS: "${MUD_PROXY_ALLOWED_ORIGINS:-*}"
      DEFAULT_ENCODING: "latin1"
      MUD_ROUTES: |-
        {"staticchaos": {"host": "mud", "port": 4000, "encoding": "latin1"}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  area:
  player:
  notes:
  finger:
  log:

services:
  mud:
    build: .
    image: staticchaos
    container_name: staticchaos
    # Host port is configurable: `MUD_PORT=4010 docker compose up`.
    # Container always listens on 4000 (the MUD requires a port > 1024).
    ports:
      - "${MUD_PORT:-4000}:4000"
    # Persist mutable game data across rebuilds. Named volumes are seeded from
    # the image on first run (so the a-z player dirs and existing data come
    # along), then survive `docker compose up --build`.
    #
    # `area` is a volume because the server auto-dumps the whole world to
    # /mud/area every 30 min (PULSE_DB_DUMP, the legacy OLC db-dump). Without a
    # volume those rewrites (and any in-game OLC builds) live only in the
    # container's writable layer and are lost on rebuild/recreate. NOTE: an
    # empty area volume seeds from the image, so when wiping it, rebuild the
    # image from the committed area/ first (or re-seed from a backup).
    volumes:
      - area:/mud/area
      - player:/mud/player
      - notes:/mud/notes
      - finger:/mud/finger
      - log:/mud/log
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Bound the captured log: the server logs to stderr (log_string), which Docker's
    # default json-file driver keeps unbounded -- cap it at ~50MB rotated so a
    # long-running server can't fill the host disk (#84).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Liveness = the MUD actually accepts a TCP connection on 4000 (bash /dev/tcp;
    # the image has bash but no nc/telnet). This drives `docker ps` health and the
    # host watchdog (backup-volumes.sh's sibling) that auto-heals a boot loop --
    # the restart policy alone can't, since it just re-runs the same bad inputs.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Browser "Play Now" client bridge: WebSocket <-> telnet proxy
  # (github.com/maldorne/mud-web-proxy). Browsers can't open raw TCP, so the
  # React xterm client (web/) talks wss/ws to this sidecar, which negotiates
  # telnet/GMCP and reaches the MUD over the internal Docker network on 4000.
  # Raw 4000 stays private; only this proxy port is published.
  mud-web-proxy:
    image: ghcr.io/maldorne/mud-web-proxy:latest
    container_name: mud-web-proxy
    depends_on:
      - mud
    # Dev: publish on all interfaces so a local `pnpm dev` (or telnet-in-browser
    # test) can reach ws://localhost:6200. In prod use docker-compose.image.yml,
    # which binds this to localhost behind a TLS reverse proxy.
    ports:
      - "${MUD_WS_PORT:-6200}:6200"
    environment:
      WS_PORT: "6200"
      TLS_ENABLED: "false"        # TLS terminated upstream (reverse proxy) in prod
      NODE_ENV: "production"
      COMPRESS: "false"           # client never requests MCCP; keep plain frames
      CHAT_ENABLED: "false"       # no in-proxy chat; avoids stray JSON to the terminal
      ENABLE_LEGACY_ROUTING: "false"  # client may only use the named route below
      ALLOWED_ORIGINS: "${MUD_PROXY_ALLOWED_ORIGINS:-*}"  # lock to the site origin in prod
      DEFAULT_ENCODING: "latin1"
      # Named route: the browser sends { connect:1, mud:"staticchaos" } and the
      # proxy resolves host/port/encoding here (so the browser can't redirect it).
      MUD_ROUTES: |-
        {"staticchaos": {"host": "mud", "port": 4000, "encoding": "latin1"}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  area:
  player:
  notes:
  finger:
  log:

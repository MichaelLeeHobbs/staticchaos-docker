services:
  mud:
    build: .
    image: staticchaos
    container_name: staticchaos
    # Host port is configurable: `MUD_PORT=4010 docker compose up`.
    # Container always listens on 4000 (the MUD requires a port > 1024).
    ports:
      - "${MUD_PORT:-4000}:4000"
    # Persist mutable game data across rebuilds. Named volumes are seeded from
    # the image on first run (so the a-z player dirs and existing data come
    # along), then survive `docker compose up --build`.
    #
    # `area` is a volume because the server auto-dumps the whole world to
    # /mud/area every 30 min (PULSE_DB_DUMP, the legacy OLC db-dump). Without a
    # volume those rewrites (and any in-game OLC builds) live only in the
    # container's writable layer and are lost on rebuild/recreate. NOTE: an
    # empty area volume seeds from the image, so when wiping it, rebuild the
    # image from the committed area/ first (or re-seed from a backup).
    volumes:
      - area:/mud/area
      - player:/mud/player
      - notes:/mud/notes
      - finger:/mud/finger
      - log:/mud/log
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Liveness = the MUD actually accepts a TCP connection on 4000 (bash /dev/tcp;
    # the image has bash but no nc/telnet). This drives `docker ps` health and the
    # host watchdog (backup-volumes.sh's sibling) that auto-heals a boot loop --
    # the restart policy alone can't, since it just re-runs the same bad inputs.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  area:
  player:
  notes:
  finger:
  log:

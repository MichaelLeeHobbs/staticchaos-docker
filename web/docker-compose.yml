services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: staticchaos-web
    container_name: staticchaos-web
    ports:
      - "80:80"
    restart: unless-stopped
    # Bound the captured log so it can't fill the host disk (#84).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

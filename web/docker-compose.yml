services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: staticchaos-web
    container_name: staticchaos-web
    # Publish spec is configurable so prod can bind internal-only (127.0.0.1:8088:80)
    # behind the Caddy TLS reverse proxy; dev/default stays on 80:80. Set WEB_PUBLISH
    # in a local .env on the host (survives redeploys).
    ports:
      - "${WEB_PUBLISH:-80:80}"
    restart: unless-stopped
    # Bound the captured log so it can't fill the host disk (#84).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

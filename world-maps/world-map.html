<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Static Chaos — Interactive World Map</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font:13px/1.5 system-ui,Segoe UI,sans-serif;background:#0f1216;color:#d7dce3;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#14171c;border-bottom:1px solid #2a2f37;z-index:10}
  #bar b{color:#fff}
  .crumb{color:#8fc1ff;cursor:pointer}.crumb:hover{text-decoration:underline}
  #q{margin-left:auto;width:300px;padding:7px 10px;background:#1c2128;border:1px solid #2a2f37;border-radius:6px;color:#fff;font-size:13px}
  #hint{color:#6b7686;font-size:11px}
  #layout{cursor:pointer;color:#8fc1ff;border:1px solid #2a2f37;border-radius:6px;padding:5px 10px;font-size:12px;white-space:nowrap}
  #layout:hover{background:#1c2128}
  svg{position:fixed;top:46px;left:0;width:100%;height:calc(100% - 46px);display:block;cursor:grab}
  svg:active{cursor:grabbing}
  .link{stroke:#3a4150;stroke-opacity:.6}
  .link.cross{stroke:#5a7;stroke-dasharray:4 3}
  .node circle{stroke:#0f1216;stroke-width:1.5px;cursor:pointer}
  .node text{fill:#c6cdd6;font-size:10px;pointer-events:none;paint-order:stroke;stroke:#0f1216;stroke-width:3px;stroke-linejoin:round}
  .node.hl circle{stroke:#ffd479;stroke-width:3px}
  .elabel{fill:#6b7686;font-size:8px;pointer-events:none}
  #detail{position:fixed;top:60px;right:14px;width:300px;max-height:calc(100% - 80px);overflow:auto;background:#14171c;border:1px solid #2a2f37;border-radius:8px;padding:14px;display:none;z-index:9}
  #detail h2{font-size:15px;margin-bottom:2px}#detail .sub{color:#6b7686;font-size:11px;margin-bottom:10px}
  #detail .k{color:#6b7686;text-transform:uppercase;font-size:10px;letter-spacing:.05em;margin:12px 0 4px}
  #detail a{color:#8fc1ff;cursor:pointer}#detail a:hover{text-decoration:underline}
  .pill{display:inline-block;background:#1c2128;border:1px solid #2a2f37;border-radius:5px;padding:1px 7px;margin:2px 4px 2px 0}
  #close{float:right;cursor:pointer;color:#6b7686}#close:hover{color:#fff}
  #legend{position:fixed;bottom:12px;left:14px;color:#6b7686;font-size:11px;background:#14171ccc;padding:6px 10px;border-radius:6px;border:1px solid #2a2f37}
</style></head><body>
<div id="bar">
  <span class="crumb" id="home">🌐 World</span>
  <b id="where"></b>
  <span id="hint">drag to pan · scroll to zoom · click a node</span>
  <input id="q" placeholder="search room or area… (name or #vnum)">
  <span id="layout" title="Switch the room layout (applies inside an area)">Layout: Force</span>
</div>
<svg></svg>
<div id="detail"></div>
<div id="legend"></div>

const DIRW = {N:'north',E:'east',S:'south',W:'west',U:'up',D:'down'};
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const svg = d3.select('svg');
let W = window.innerWidth, H = window.innerHeight - 46;
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.08, 6]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);
window.addEventListener('resize', () => { W = window.innerWidth; H = window.innerHeight - 46; });

let sim = null, view = null, nodeById = new Map();
let layoutMode = 'force';
const lbl = s => { s = String(s==null?'':s); return s.length > 16 ? s.slice(0,15)+'…' : s; };

function clearView(){ if (sim) sim.stop(); g.selectAll('*').remove(); nodeById = new Map(); hideDetail(); }
function resetZoom(k){ svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2).scale(k||0.6)); }

function start(nodes, links, opts){
  opts = opts || {};
  nodeById = new Map(nodes.map(n => [n.id, n]));
  const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('class', d => 'link' + (d.cross ? ' cross' : ''))
    .attr('stroke-width', d => Math.min(1 + (d.count||1)*0.3, 4));
  const elabel = opts.dirLabels ? g.append('g').selectAll('text').data(links).join('text')
    .attr('class','elabel').text(d => d.dir || '') : null;
  const node = g.append('g').selectAll('g').data(nodes).join('g').attr('class','node')
    .call(drag()).on('click', (e,d) => { e.stopPropagation(); opts.onClick && opts.onClick(d); });
  node.append('circle').attr('r', d => d.r).attr('fill', d => d.color);
  const text = node.append('text').text(d => lbl(d.label));
  if (opts.labelBelow) text.attr('x', 0).attr('y', d => d.r + 11).attr('text-anchor','middle');
  else text.attr('x', d => d.r + 3).attr('y', 4);
  node.append('title').text(d => d.title || d.label);

  function ticked(){
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    if (elabel) elabel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);
    node.attr('transform', d => 'translate('+d.x+','+d.y+')');
  }

  if (opts.grid){
    // fixed compass-grid positions; a force-less sim just applies them + drag
    nodes.forEach(n => { const p = opts.grid.get(n.id); if (p){ n.x=n.fx=p.x; n.y=n.fy=p.y; } });
    // link force with strength 0 resolves source/target ids to node objects
    // (so endpoints draw correctly) without moving the pinned nodes
    sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).strength(0))
      .on('tick', ticked);
    ticked();
    fitToGrid(opts.grid);
  } else {
    sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(opts.dist||70).strength(0.4))
      .force('charge', d3.forceManyBody().strength(opts.charge||-220))
      .force('collide', d3.forceCollide().radius(d => d.r + 16))
      .force('x', d3.forceX(0).strength(0.04)).force('y', d3.forceY(0).strength(0.04))
      .on('tick', ticked);
    resetZoom(opts.zoom||0.6);
  }
}
function drag(){
  return d3.drag()
    .on('start',(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',(e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on('end',(e,d)=>{ if(!e.active) sim.alphaTarget(0); if(layoutMode!=='grid'||view===null){ d.fx=null; d.fy=null; } });
}

/* compass-grid layout: BFS from the recall (or first) room, placing each room
 * at its neighbour's cell + the exit's direction offset; collisions spiral to
 * the nearest free cell so nothing stacks. Returns id -> {x,y} in pixels. */
function computeGrid(areaId, roomVnums, inArea, nodes){
  const DELTA = {N:[0,-1],S:[0,1],E:[1,0],W:[-1,0],U:[1,-1],D:[-1,1]};
  const SP = 160;
  const cells = new Set(), gpos = new Map();
  function claim(gx,gy){
    if(!cells.has(gx+','+gy)){ cells.add(gx+','+gy); return [gx,gy]; }
    for(let r=1;r<80;r++) for(let dx=-r;dx<=r;dx++) for(let dy=-r;dy<=r;dy++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
      const k=(gx+dx)+','+(gy+dy);
      if(!cells.has(k)){ cells.add(k); return [gx+dx,gy+dy]; }
    }
    return [gx,gy];
  }
  const seedV = inArea.has(DATA.recall) ? DATA.recall : +roomVnums[0];
  const seedId = 'R'+seedV;
  gpos.set(seedId, claim(0,0));
  const queue = [seedId], seen = new Set([seedId]);
  while(queue.length){
    const id = queue.shift(); const c = gpos.get(id);
    if(id[0] !== 'R') continue;
    const r = DATA.rooms[+id.slice(1)]; if(!r) continue;
    for(const dir in r.e){
      const to = r.e[dir]; const nid = inArea.has(to) ? 'R'+to : 'P'+to;
      if(seen.has(nid)) continue; seen.add(nid);
      const d = DELTA[dir] || [1,0];
      gpos.set(nid, claim(c[0]+d[0], c[1]+d[1]));
      queue.push(nid);
    }
  }
  let col = 0; const baseY = Math.max(0, ...[...gpos.values()].map(c=>c[1])) + 2;
  for(const n of nodes) if(!gpos.has(n.id)) gpos.set(n.id, claim(col++, baseY));
  const px = new Map();
  for(const [id,c] of gpos) px.set(id, { x:c[0]*SP, y:c[1]*SP });
  return px;
}
function fitToGrid(grid){
  const xs=[...grid.values()].map(p=>p.x), ys=[...grid.values()].map(p=>p.y);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const k = Math.max(0.12, Math.min((W-140)/((maxx-minx)+220), (H-140)/((maxy-miny)+220), 1.1));
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W/2 - cx*k, H/2 - cy*k).scale(k));
}

/* ---- world view: areas ---- */
function showWorld(){
  view = null; clearView();
  document.getElementById('where').textContent = '';
  const nodes = DATA.areas.map(a => ({
    id:a.id, label:a.name, r: Math.max(6, Math.min(26, 5+Math.sqrt(a.rooms)*2)),
    color: a.reach ? '#4b86d6' : '#c0504d', title: a.name+' — '+a.rooms+' rooms'+(a.reach?'':' (unreachable on foot)')
  }));
  const links = DATA.areaLinks.map(l => ({source:l.source, target:l.target, count:l.count}));
  start(nodes, links, { dist: 150, charge: -800, zoom: 0.5, onClick: d => showArea(d.id) });
}

/* ---- area view: rooms ---- */
function showArea(areaId, focusVnum){
  const area = DATA.areas.find(a => a.id === areaId);
  view = areaId; clearView();
  document.getElementById('where').innerHTML = '› ' + esc(area ? area.name : areaId) + ' <span style="color:#6b7686">('+esc(areaId)+')</span>';
  const roomVnums = Object.keys(DATA.rooms).filter(v => DATA.rooms[v].a === areaId);
  const inArea = new Set(roomVnums.map(Number));
  const nodes = [], links = [], portals = new Map();
  for (const v of roomVnums){
    const r = DATA.rooms[v];
    nodes.push({ id:'R'+v, kind:'room', vnum:+v, label:r.n||('#'+v), r:7, color:(+v===DATA.recall?'#e0b341':'#6f9ad6'), title:(r.n||'')+' #'+v });
  }
  for (const v of roomVnums){
    const r = DATA.rooms[v];
    for (const dir in r.e){
      const to = r.e[dir];
      if (inArea.has(to)){ links.push({ source:'R'+v, target:'R'+to, dir }); }
      else {
        const dest = DATA.rooms[to];
        const pid = 'P'+to;
        if (!portals.has(pid)){
          const ta = dest ? dest.a : null;
          nodes.push({ id:pid, kind:'portal', toVnum:to, toArea:ta, r:9,
            color: ta ? '#5aa17a' : '#7a4a4a',
            label: ta ? ('▸ '+ta) : ('?? #'+to),
            title: dest ? (dest.n+' — '+ta+' #'+to+' (click to travel)') : ('broken exit #'+to) });
          portals.set(pid, ta);
        }
        links.push({ source:'R'+v, target:pid, dir, cross:true });
      }
    }
  }
  const useGrid = layoutMode === 'grid';
  const grid = useGrid ? computeGrid(areaId, roomVnums, inArea, nodes) : null;
  start(nodes, links, { dist: 60, charge: -160, dirLabels:true, labelBelow:useGrid, grid,
    zoom: nodes.length>120?0.35:0.7,
    onClick: d => { if (d.kind==='portal'){ if (d.toArea) showArea(d.toArea, d.toVnum); } else showRoom(d.vnum); } });
  if (focusVnum != null) focusNode('R'+focusVnum);
}

function focusNode(id){
  const n = nodeById.get(id); if (!n) return;
  n.fx = n.x; n.fy = n.y;
  d3.selectAll('.node').classed('hl', d => d.id===id);
  // settle a little then center
  for (let i=0;i<60;i++) sim.tick();
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(W/2 - n.x*1.1, H/2 - n.y*1.1).scale(1.1));
  setTimeout(()=>{ n.fx=null; n.fy=null; }, 600);
  if (id[0]==='R') showRoom(n.vnum);
}

/* ---- detail panel ---- */
function hideDetail(){ document.getElementById('detail').style.display='none'; }
function showRoom(vnum){
  const r = DATA.rooms[vnum]; if (!r) return;
  d3.selectAll('.node').classed('hl', d => d.id==='R'+vnum);
  let h = '<span id="close" onclick="hideDetail()">✕</span>';
  h += '<h2>'+esc(r.n||('#'+vnum))+'</h2><div class="sub">room #'+vnum+' · '+esc(r.a)+' · sector '+r.s+'</div>';
  const ex = Object.entries(r.e||{});
  h += '<div class="k">Exits</div>';
  h += ex.length ? ex.map(([d,to])=>{
    const dest = DATA.rooms[to]; const here = dest && dest.a===r.a;
    const fn = here ? "go("+to+")" : (dest ? "trav('"+dest.a+"',"+to+")" : "");
    return '<div><a onclick="'+fn+'">'+DIRW[d]+' → '+(dest?esc(dest.n):'#'+to)+(here?'':' <span style=\'color:#5aa17a\'>['+(dest?esc(dest.a):'?')+']</span>')+'</a></div>';
  }).join('') : '<div class="sub">none</div>';
  const mobs = DATA.roomMobs[vnum]||[], its = DATA.roomItems[vnum]||[];
  if (mobs.length){ h += '<div class="k">Creatures</div>'+mobs.map(m=>'<span class="pill">'+esc(m.n)+' (L'+m.l+')</span>').join(''); }
  if (its.length){ h += '<div class="k">Items</div>'+its.map(i=>'<span class="pill">'+esc(i.n)+'</span>').join(''); }
  const dv = document.getElementById('detail'); dv.innerHTML = h; dv.style.display='block';
}
function go(vnum){ focusNode('R'+vnum); }                 // same-area exit
function trav(areaId, vnum){ showArea(areaId, vnum); }     // cross-area exit

/* ---- search ---- */
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const area = DATA.areas.find(a => a.id.toLowerCase()===q || a.name.toLowerCase().includes(q));
  let room = null;
  for (const v in DATA.rooms){ const r=DATA.rooms[v]; if (v===q.replace('#','') || (r.n&&r.n.toLowerCase().includes(q))){ room={v:+v,a:r.a}; break; } }
  if (room){ if (view!==room.a) showArea(room.a, room.v); else focusNode('R'+room.v); }
  else if (area){ showArea(area.id); }
});
document.getElementById('home').addEventListener('click', showWorld);
const layoutEl = document.getElementById('layout');
